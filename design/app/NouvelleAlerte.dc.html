/span></span> sa normale,</sc-if>

span></span> de vues,</sc-if>
<sc-if value="{{isFormat}}" hint-placeholder-val="{{false}}"> {{deNiche}} <span style="position: relative; display: inline-flex; vertical-align: middle; margin: 4px 2px;"><select value="{{niche}}" onChange="{{setNiche}}" style="appearance: none; -webkit-appearance: none; height: 46px; padding: 0 38px 0 16px; border-radius: 14px; border: 1px solid var(--accent-edge); background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; cursor: pointer;"><sc-for list="{{niches}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.v}}</option></sc-for></select><span aria-hidden="true" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--accent); display: inline-flex;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></span> est repris par <span style="position: relative; display: inline-flex; vertical-align: middle; margin: 4px 2px;"><select value="{{seuil}}" onChange="{{setSeuil}}" style="appearance: none; -webkit-appearance: none; height: 46px; padding: 0 38px 0 16px; border-radius: 14px; border: 1px solid var(--accent-edge); background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; cursor: pointer;"><sc-for list="{{seuils}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.v}}</option></sc-for></select><span aria-hidden="true" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--accent); display: inline-flex;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></span> comptes ou plus,</sc-if>
 <span style="position: relative; display: inline-flex; vertical-align: middle; margin: 4px 2px;"><select value="{{marche}}" onChange="{{setMarche}}" style="appearance: none; -webkit-appearance: none; height: 46px; padding: 0 38px 0 16px; border-radius: 14px; border: 1px solid var(--accent-edge); background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; cursor: pointer;"><sc-for list="{{marches}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.v}}</option></sc-for></select><span aria-hidden="true" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--accent); display: inline-flex;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></span>.</p>
<sc-if value="{{showHits}}" hint-placeholder-val="{{true}}"><div style="border-radius: 22px; border: 1px solid var(--line); background: var(--surface); padding: 18px 20px; display: flex; align-items: center; gap: 20px;"><span style="flex: 1; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 14px; font-weight: 700;">Dans les alertes de la semaine</span><span style="font-size: 13px; color: var(--ink-faint);">{{hitsText}}</span></span><sc-for list="{{hits}}" as="h" hint-placeholder-count="3"><span class="sw-video" style="display: block; width: 58px; border-radius: 10px;"><img class="sw-cover" src="{{h.src}}" alt=""><span class="sw-video-shade"></span><span style="position: absolute; left: 5px; right: 5px; bottom: 5px; font-size: 10px; font-weight: 800; color: #FFFFFF; text-align: center;">{{h.x}}</span></span></sc-for></div></sc-if>
<div style="display: flex; justify-content: flex-end;"><button class="sw-btn sw-btn-primary sw-btn-lg" type="button" onClick="{{create}}">{{cta}}<span class="sw-btn-tile"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button></div>

<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"onCreate":{"editor":null},"rule":{"editor":null},"niches":{"editor":null},"preview":{"editor":null},"get":{"editor":null},"$preview":{"width":960,"height":760}}'>
class Component extends DCLogic {
  componentDidMount() { if (this.first) this.first.focus(); }
  renderVals() {
    // Exemple du canevas : ce que l'alerte par défaut trouve dans la semaine d'exemple.
    const HITS = [{"src": "/_blob/8a6c2da5244cd29c8c4935f8ddb5e5c5", "x": "1 226×"}, {"src": "/_blob/2010c321b827a0e032d25e98d057eca3", "x": "455×"}, {"src": "/_blob/ba0c093e34600f0dfeb6bacdc6dee0a4", "x": "2 333×"}];
    const NICHES = ["Études", "Couple", "Séduction IA", "Jalousie et ex", "Side hustle", "Santé et physique", "Langues", "Foi", "Social et loisirs", "Beauté IA"];
    // Libellé à l'écran -> valeur gardée dans l'alerte (AlertesA l'enregistre dans saved('alertRules')) :
    // { quoi: 'compte'|'video'|'format', niche: nom|null, seuil: nombre, marche: code du marché|null }.
    const QUOI = [['un compte', 'compte'], ['une vidéo d’app', 'video'], ['un format', 'format']];
    const SE = { compte: [['10×', 10], ['100×', 100], ['1 000×', 1000]], video: [['500 k', 5e5], ['1 M', 1e6], ['5 M', 5e6]], format: [['3', 3], ['5', 5], ['10', 10]] };
    const DEF = { compte: 100, video: 1e6, format: 3 };
    const PREP = (n) => { n = String(n || ''); if (/^(États-Unis|Pays-Bas|Philippines|Émirats arabes unis|Comores|Maldives|Seychelles|Bahamas)$/.test(n)) return ['aux', 'les ']; if (/^[AEÉÈIÎOUYH]/.test(n) && !/^(Honduras|Hongrie)$/.test(n)) return ['en', 'l’']; return /e$/.test(n) && !/^(Mexique|Mozambique|Cambodge|Zimbabwe|Belize)$/.test(n) ? ['en', 'la '] : ['au', 'le ']; }; // « en France », « au Mexique », « aux États-Unis »
    const ADM = this.props && typeof this.props.get === 'function' ? this.props.get('apps') : null;
    const MK = [['sur tous les marchés', null]].concat(((ADM && ADM.markets) || [['FR', 'France'], ['US', 'États-Unis'], ['MX', 'Mexique'], ['ES', 'Espagne'], ['BR', 'Brésil']]).filter((m) => m[0] && m[0] !== 'XX').map((m) => [PREP(m[1])[0] + ' ' + m[1], m[0]]));
    const P = this.props || {};
    const r0 = P.rule && P.rule.quoi ? P.rule : null; // alerte à modifier, sinon une nouvelle
    const st = this.state || {};
    const pick = (k, def) => (st[k] !== undefined ? st[k] : r0 && r0[k] !== undefined ? r0[k] : def);
    const lab = (xs, v) => (xs.filter((x) => x[1] === v)[0] || xs[0])[0];
    const val = (xs, l) => (xs.filter((x) => x[0] === l)[0] || xs[0])[1];
    const quoi = SE[pick('quoi', 'compte')] ? pick('quoi', 'compte') : 'compte';
    const s0 = pick('seuil', DEF[quoi]);
    const seuil = SE[quoi].some((x) => x[1] === s0) ? s0 : DEF[quoi];
    const niche = pick('niche', null);
    const marche = pick('marche', null);
    const ANY = 'n’importe quelle niche';
    const names = (P.niches && P.niches.length ? P.niches : NICHES).slice();
    if (niche && names.indexOf(niche) < 0) names.push(niche);
    const NI = [[ANY, null]].concat(names.map((n) => [n, n]));
    const opt = (xs) => xs.map((x) => ({ v: x[0] }));
    const close = () => { if (P.onClose) P.onClose(); };
    const rule = { quoi, niche, seuil, marche };
    // Aperçu : ce que l'alerte trouve dans les alertes de la semaine (fourni par AlertesA ; null tant qu'il ne sait pas).
    const pv = typeof P.preview === 'function' ? P.preview(rule) : undefined;
    const sample = pv === undefined && quoi === 'compte' && seuil === 100 && !marche && (!niche || niche === 'Études');
    return {
      head: r0 ? 'Modifier l’alerte' : 'Nouvelle alerte', cta: r0 ? 'Enregistrer' : 'Créer l’alerte',
      quoi: lab(QUOI, quoi), niche: lab(NI, niche), seuil: lab(SE[quoi], seuil), marche: lab(MK, marche),
      deNiche: niche ? 'de la niche' : 'de',
      quois: opt(QUOI), niches: opt(NI), seuils: opt(SE[quoi]), marches: opt(MK),
      isCompte: quoi === 'compte', isApp: quoi === 'video', isFormat: quoi === 'format',
      setQuoi: (e) => { const q = val(QUOI, e.target.value); this.setState({ quoi: q, seuil: DEF[q] }); },
      setNiche: (e) => this.setState({ niche: val(NI, e.target.value) }),
      setSeuil: (e) => this.setState({ seuil: val(SE[quoi], e.target.value) }),
      setMarche: (e) => this.setState({ marche: val(MK, e.target.value) }),
      showHits: pv ? true : sample, hits: pv ? pv.hits : HITS, hitsText: pv ? pv.text : 'Trois vidéos d’Astra AI, entre le 07 et le 09/11',
      setFirst: (el) => { this.first = el; },
      keys: (e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } },
      close,
      create: () => {
        if (P.onCreate) P.onCreate(rule);
        close();
      }
    };
  }
}
</script>
