<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Swarm, ajouter à un dossier</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/swarm/tokens.css">
<link rel="stylesheet" href="ds/swarm/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4C9AFF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div class="sw" ref="{{setRoot}}" onKeyDown="{{keys}}" role="dialog" aria-label="Ajouter à un dossier" style="width: 360px; box-sizing: border-box; border-radius: 22px; background: var(--surface-raised); border: 1px solid var(--line-strong); box-shadow: 0 30px 80px rgba(0,0,0,0.6); padding: 14px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); font-family: var(--font-body); animation: sw-rise 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;">
<div class="sw-search" style="height: 42px; padding: 0 12px; box-shadow: none; border-radius: 12px;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM15.5 15.5L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg><input ref="{{setInput}}" class="sw-search-input" type="search" value="{{q}}" onChange="{{onQ}}" onKeyDown="{{inputKeys}}" maxlength="60" aria-label="Chercher ou créer un dossier" placeholder="Chercher ou créer un dossier…" autocomplete="off" style="font-size: 14px;"></div>
<div role="group" aria-label="Dossiers" style="display: flex; flex-direction: column; max-height: 260px; overflow-y: auto;">
<sc-for list="{{rows}}" as="d" hint-placeholder-count="4"><button type="button" role="checkbox" aria-checked="{{d.on}}" onClick="{{d.toggle}}" style="display: flex; align-items: center; gap: 12px; padding: 8px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font-family: inherit; text-align: left; cursor: pointer;"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: {{d.box}}; box-shadow: inset 0 0 0 1.5px {{d.boxe}}; color: {{d.ck}};"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><sc-if value="{{d.src}}" hint-placeholder-val="{{true}}"><span style="width: 32px; height: 32px; border-radius: 9px; overflow: hidden; position: relative; flex-shrink: 0;"><img class="sw-cover" src="{{d.src}}" alt=""></span></sc-if><sc-if value="{{d.nosrc}}" hint-placeholder-val="{{false}}"><span style="width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--track); color: var(--ink-faint);"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></sc-if><span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{d.name}}</span><span style="font-size: 12px; color: var(--ink-faint); white-space: nowrap;">{{d.count}}</span></button></sc-for>
</div>
<sc-if value="{{canCreate}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{create}}" class="sw-more" style="padding: 6px 8px; gap: 10px; color: var(--accent); border: 0; background: transparent; cursor: pointer; font-family: inherit;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Créer « {{q}} »</button></sc-if>
<sc-if value="{{noCreate}}" hint-placeholder-val="{{true}}"><span style="padding: 2px 8px; font-size: 12px; color: var(--ink-faint);">Tape un nom pour créer un dossier.</span></sc-if>
<sc-if value="{{inAny}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 8px; padding: 4px 8px; font-size: 13px; font-weight: 600; color: var(--accent);"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{inLabel}}</span></sc-if>
<button class="sw-btn sw-btn-primary sw-btn-sm sw-btn-block" type="button" onClick="{{done}}">Terminé<span class="sw-btn-tile"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"item":{"editor":null},"saved":{"editor":null},"save":{"editor":null},"$preview":{"width":360,"height":420}}'>
class Component extends DCLogic {
  componentDidMount() {
    if (this.inp) this.inp.focus();
    this.out = (e) => {
      if (!this.root || this.root.contains(e.target)) return;
      if (e.target.closest && e.target.closest('[data-aj-trigger]')) return;
      this.close();
    };
    document.addEventListener('mousedown', this.out);
  }
  componentWillUnmount() { document.removeEventListener('mousedown', this.out); }
  close() { if (this.props.onClose) this.props.onClose(); }
  // Les dossiers de la personne : sur le site, saved('folders') (docs/donnees-app.md) ;
  // sur le canevas, quatre dossiers d'exemple gardés dans l'état local.
  live() { const P = this.props || {}; return typeof P.saved === 'function' && typeof P.save === 'function'; }
  folders() {
    if (this.live()) return this.props.saved('folders');
    const st = this.state || {};
    if (st.local) return st.local;
    return [['Études, ce qui marche', 7, '/_blob/ba0c093e34600f0dfeb6bacdc6dee0a4'], ['Side hustle', 5, '/_blob/0488fb4a3b81c670ae8e5e16539e99ff'], ['Jalousie et ex', 5, '/_blob/608419d1efd84ba7895e44ce6290cd99'], ['Couple', 4, '/_blob/63119f505f58b810c055512e54a2709e']]
      .map((f, i) => ({ id: 'ex' + i, name: f[0], createdAt: 0, items: Array.from({ length: f[1] }, (_, j) => ({ kind: 'video', id: 'ex' + i + '-' + j, label: '', cover: j === 0 ? f[2] : null, at: 0 })) }));
  }
  write(next) { if (this.live()) this.props.save('folders', next); else this.setState({ local: next }); }
  renderVals() {
    const st = this.state || {};
    const P = this.props || {};
    // L'élément à ranger : passé par l'écran hôte ({ kind, id, label, cover }) ; sur le canevas, une app d'exemple.
    const item = P.item || (this.live() ? null : { kind: 'app', id: 'astraai', label: 'Astra AI', cover: '/_blob/8786a14b5a2e9593ed85c3dd97461c2b' });
    const raw = this.folders();
    const loading = raw === undefined;
    const all = Array.isArray(raw) ? raw : [];
    const same = (x) => !!item && x.kind === item.kind && x.id === item.id;
    const has = (f) => (f.items || []).some(same);
    const entry = () => ({ kind: item.kind, id: item.id, label: item.label || '', cover: item.cover || null, at: Date.now() });
    const fresh = () => { const v = this.folders(); return Array.isArray(v) ? v : []; };
    // Un clic coche ou décoche : la valeur entière est réécrite aussitôt.
    const toggle = (id) => {
      if (!item || this.folders() === undefined) return;
      this.write(fresh().map((f) => (f.id !== id ? f : Object.assign({}, f, { items: has(f) ? (f.items || []).filter((x) => !same(x)) : [entry()].concat(f.items || []) }))));
    };
    const q = st.q || '';
    const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const nq = norm(q.trim());
    const exact = all.some((f) => norm(f.name) === nq);
    const canCreate = !loading && !!nq && !exact;
    const create = () => {
      const name = q.trim();
      if (!name || !canCreate) return;
      const now = Date.now();
      this.write([{ id: now.toString(36) + Math.random().toString(36).slice(2, 6), name, createdAt: now, items: item ? [entry()] : [] }].concat(fresh()));
      this.setState({ q: '' });
    };
    const rows = all.filter((f) => !nq || norm(f.name).indexOf(nq) >= 0).map((f) => {
      const c = has(f);
      const n = (f.items || []).length;
      const src = ((f.items || []).filter((x) => x.cover)[0] || {}).cover || '';
      return { name: f.name, src, nosrc: !src, count: n + (n > 1 ? ' éléments' : ' élément'), on: c ? 'true' : 'false',
        box: c ? 'var(--blue-600)' : 'transparent', boxe: c ? 'var(--blue-600)' : 'var(--line-strong)', ck: c ? '#FFFFFF' : 'transparent',
        toggle: () => toggle(f.id) };
    });
    const n = all.filter(has).length;
    return {
      q, rows, canCreate, create,
      noCreate: !loading && !nq && n === 0,
      inAny: n > 0, inLabel: 'Dans ' + n + (n > 1 ? ' dossiers' : ' dossier'),
      onQ: (e) => this.setState({ q: e.target.value }),
      inputKeys: (e) => { if (e.key === 'Enter') { e.preventDefault(); create(); } },
      setInput: (el) => { this.inp = el; },
      setRoot: (el) => { this.root = el; },
      keys: (e) => { if (e.key === 'Escape') { e.preventDefault(); this.close(); } },
      done: () => this.close()
    };
  }
}
</script>
</body>
</html>
