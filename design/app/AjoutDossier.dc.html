<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Swarm, ajouter à un dossier</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/swarm/tokens.css">
<link rel="stylesheet" href="ds/swarm/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4C9AFF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div class="sw" ref="{{setRoot}}" onKeyDown="{{keys}}" role="dialog" aria-label="Ajouter à un dossier" style="width: 360px; box-sizing: border-box; border-radius: 22px; background: var(--surface-raised); border: 1px solid var(--line-strong); box-shadow: 0 30px 80px rgba(0,0,0,0.6); padding: 14px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); font-family: var(--font-body); animation: sw-rise 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;">
<div class="sw-search" style="height: 42px; padding: 0 12px; box-shadow: none; border-radius: 12px;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM15.5 15.5L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg><input ref="{{setInput}}" class="sw-search-input" type="search" value="{{q}}" onChange="{{onQ}}" aria-label="Chercher ou créer un dossier" placeholder="Chercher ou créer un dossier…" autocomplete="off" style="font-size: 14px;"></div>
<div role="group" aria-label="Dossiers" style="display: flex; flex-direction: column; max-height: 260px; overflow-y: auto;">
<sc-for list="{{rows}}" as="d" hint-placeholder-count="4"><button type="button" role="checkbox" aria-checked="{{d.on}}" onClick="{{d.toggle}}" style="display: flex; align-items: center; gap: 12px; padding: 8px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font-family: inherit; text-align: left; cursor: pointer;"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: {{d.box}}; box-shadow: inset 0 0 0 1.5px {{d.boxe}}; color: {{d.ck}};"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><sc-if value="{{d.src}}" hint-placeholder-val="{{true}}"><span style="width: 32px; height: 32px; border-radius: 9px; overflow: hidden; position: relative; flex-shrink: 0;"><img class="sw-cover" src="{{d.src}}" alt=""></span></sc-if><sc-if value="{{d.nosrc}}" hint-placeholder-val="{{false}}"><span style="width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--track); color: var(--ink-faint);"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></sc-if><span style="flex: 1; font-size: 14px; font-weight: 600;">{{d.name}}</span><span style="font-size: 12px; color: var(--ink-faint);">{{d.count}}</span></button></sc-for>
</div>
<sc-if value="{{canCreate}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{create}}" class="sw-more" style="padding: 6px 8px; gap: 10px; color: var(--accent); border: 0; background: transparent; cursor: pointer; font-family: inherit;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Créer « {{q}} »</button></sc-if>
<sc-if value="{{noCreate}}" hint-placeholder-val="{{true}}"><span style="padding: 2px 8px; font-size: 12px; color: var(--ink-faint);">Tape un nom pour créer un dossier.</span></sc-if>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 8px; padding: 4px 8px; font-size: 13px; font-weight: 600; color: var(--accent);"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{savedLabel}}</span></sc-if>
<button class="sw-btn sw-btn-primary sw-btn-sm sw-btn-block" type="button" onClick="{{save}}">Enregistrer<span class="sw-btn-tile"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":360,"height":420}}'>
class Component extends DCLogic {
  componentDidMount() {
    if (this.inp) this.inp.focus();
    this.out = (e) => {
      if (!this.root || this.root.contains(e.target)) return;
      if (e.target.closest && e.target.closest('[data-aj-trigger]')) return;
      this.close();
    };
    document.addEventListener('mousedown', this.out);
  }
  componentWillUnmount() { document.removeEventListener('mousedown', this.out); clearTimeout(this.tm); }
  close() { if (this.props.onClose) this.props.onClose(); }
  renderVals() {
    const FL = [{"name": "Études, ce qui marche", "n": 7, "src": "/_blob/ba0c093e34600f0dfeb6bacdc6dee0a4"}, {"name": "Side hustle", "n": 5, "src": "/_blob/0488fb4a3b81c670ae8e5e16539e99ff"}, {"name": "Jalousie et ex", "n": 5, "src": "/_blob/608419d1efd84ba7895e44ce6290cd99"}, {"name": "Couple", "n": 4, "src": "/_blob/63119f505f58b810c055512e54a2709e"}];
    const st = this.state || {};
    const q = st.q || '';
    const on = st.on || {};
    const extra = st.extra || [];
    const all = extra.map((n) => ({ name: n, n: 0, src: '' })).concat(FL);
    const norm = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const nq = norm(q.trim());
    const rows = all.filter((f) => !nq || norm(f.name).indexOf(nq) >= 0).map((f) => {
      const c = !!on[f.name];
      return { name: f.name, src: f.src, nosrc: !f.src, count: (f.n + (c ? 1 : 0)) + ' éléments', on: c ? 'true' : 'false',
        box: c ? 'var(--blue-600)' : 'transparent', boxe: c ? 'var(--blue-600)' : 'var(--line-strong)', ck: c ? '#FFFFFF' : 'transparent',
        toggle: () => this.setState({ on: Object.assign({}, on, { [f.name]: !c }), saved: false }) };
    });
    const exact = all.some((f) => norm(f.name) === nq);
    const n = Object.keys(on).filter((k) => on[k]).length;
    return {
      q, rows,
      canCreate: !!nq && !exact, noCreate: !nq && !st.saved,
      onQ: (e) => this.setState({ q: e.target.value }),
      create: () => { const name = q.trim(); this.setState({ extra: [name].concat(extra), on: Object.assign({}, on, { [name]: true }), q: '' }); },
      setInput: (el) => { this.inp = el; },
      setRoot: (el) => { this.root = el; },
      keys: (e) => { if (e.key === 'Escape') { e.preventDefault(); this.close(); } },
      saved: !!st.saved, savedLabel: n === 0 ? 'Aucun dossier coché' : ('Enregistré dans ' + n + (n > 1 ? ' dossiers' : ' dossier')),
      save: () => { this.setState({ saved: true }); clearTimeout(this.tm); if (n > 0) this.tm = setTimeout(() => this.close(), 900); }
    };
  }
}
</script>
</body>
</html>
