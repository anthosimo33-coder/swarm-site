.m-tagn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--track);box-shadow:inset 0 0 0 1px var(--line);font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap;max-width:100%;box-sizing:border-box}
.m-tagn .m-ic{width:13px;height:13px;color:var(--ink-muted)}
.m-fc{margin:14px 20px 0;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,var(--card-top),var(--card-bottom));box-shadow:inset 0 0 0 1px var(--card-edge)}
.m-fc-line{display:block;height:1px;background:var(--line)}
.m-fc-row{display:flex;gap:8px;padding:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.m-tc{display:flex;gap:4px;padding:5px;border:0;border-radius:16px;background:linear-gradient(180deg,var(--card-top),var(--card-bottom));box-shadow:inset 0 0 0 1px var(--card-edge)}
.m-tc.is-flat{background:none;box-shadow:none;border-radius:0}
.m-tc .sw-tab{flex:1 1 0;min-width:0;height:auto;min-height:44px;margin:0;padding:0 8px;border:0;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:transparent;box-shadow:none;font-size:13px;color:var(--ink-muted);text-decoration:none}
.m-tc .sw-tab[aria-selected="true"]{background:rgba(255,255,255,0.10);color:var(--ink);box-shadow:none;border:0}
.m-tc .sw-tab .m-ic,.m-tc .sw-tab>svg{color:var(--ink-faint)}
.m-tc .sw-tab[aria-selected="true"] .m-ic,.m-tc .sw-tab[aria-selected="true"]>svg{color:var(--accent)}
.m-tc.is-scroll{overflow-x:auto;scrollbar-width:none}.m-tc.is-scroll .sw-tab{flex:0 0 auto;padding:0 12px}
.m-tc.is-stack .sw-tab{flex-direction:column;gap:4px;min-height:56px;font-size:12px;padding:6px 4px;text-align:center}
.m-fb{display:inline-flex;align-items:center;gap:8px;flex-shrink:0;height:44px;padding:0 12px;border:0;border-radius:12px;background:var(--track);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.m-fb>svg{flex-shrink:0;color:var(--ink-faint)}.m-fb .m-fb-k{color:var(--ink-muted)}.m-fb .m-fb-v{font-weight:600}
