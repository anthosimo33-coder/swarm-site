<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kopycat, compte : les réglages</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/swarm/tokens.css">
<link rel="stylesheet" href="ds/swarm/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05070C}
a{color:#4C9AFF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div class="sw" style="display: flex; flex-wrap: wrap; min-height: 1280px; background: var(--surface); color: var(--ink); font-family: var(--font-body);">

<nav class="sw-sidebar" aria-label="Navigation principale">
<a class="sw-side-logo" href="Main.dc.html" aria-label="Kopycat, accueil"><span class="sw-app-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="8" r="2.3" fill="#FFFFFF"></circle><circle cx="11" cy="5" r="2.3" fill="#FFFFFF"></circle><circle cx="17" cy="8" r="2.3" fill="#FFFFFF"></circle><circle cx="8" cy="14" r="2.3" fill="#FFFFFF" fill-opacity="0.6"></circle><circle cx="14" cy="13" r="2.3" fill="#FFFFFF" fill-opacity="0.6"></circle><circle cx="19" cy="17" r="2.3" fill="#FFFFFF" fill-opacity="0.6"></circle><circle cx="11" cy="20" r="2.3" fill="#FFFFFF" fill-opacity="0.6"></circle></svg></span></a>
<button class="sw-side-item" type="button" data-cmdk="true" onClick="{{openPal}}" aria-label="Chercher" style="border: 0; background: transparent; font-family: inherit; cursor: pointer;"><span class="sw-side-ico"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM15.5 15.5L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Chercher</button>
<sc-for list="{{sb}}" as="n" hint-placeholder-count="6">
<a class="sw-side-item" href="{{n.href}}" aria-current="{{n.cur}}"><span class="sw-side-ico"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>{{n.label}}</a>
</sc-for>
<div class="sw-side-foot">
<a class="sw-avatar" href="CompteA.dc.html" aria-label="Mon compte" style="text-decoration: none;">{{me.initiale}}</a>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: var(--surface);">
<div style="display: flex; flex: 1;">
<aside style="width: 260px; flex-shrink: 0; padding: 32px 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0 12px 18px; font-family: var(--font-display); font-size: 32px; font-weight: 700; letter-spacing: -0.04em;">Compte</h1>
<sc-for list="{{sub}}" as="s" hint-placeholder-count="2"><a href="{{s.href}}" onClick="{{s.pick}}" aria-current="{{s.cur}}" style="padding: 10px 14px; border-radius: 12px; background: {{s.bg}}; color: {{s.ink}}; font-size: 15px; font-weight: 600; text-decoration: none;">{{s.l}}</a></sc-for>
<a class="sw-link-quiet" href="ConnexionA.dc.html" onClick="{{logout}}" style="margin: auto 14px 0; font-size: 14px;">Se déconnecter</a>
</aside>
<div style="flex: 1; min-width: 0; padding: 36px 48px 48px; display: flex; flex-direction: column; gap: 36px; max-width: 820px;">
<section style="display: flex; flex-direction: column; gap: 20px;"><div style="display: flex; flex-direction: column; gap: 4px;"><h2 id="cp-profil" style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em;">Profil</h2></div>
<div style="display: flex; align-items: center; gap: 18px;"><span class="sw-avatar" style="width: 72px; height: 72px; font-size: 28px;">{{me.initiale}}</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;"><sc-if value="{{me.prenom}}" hint-placeholder-val="{{true}}"><div class="sw-field"><span class="sw-label">Prénom</span><span style="height: 48px; display: flex; align-items: center; padding: 0 16px; border-radius: var(--radius-md); background: var(--track); font-size: 15px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{me.prenom}}</span></div></sc-if><div class="sw-field"><span class="sw-label">E-mail</span><span style="height: 48px; display: flex; align-items: center; padding: 0 16px; border-radius: var(--radius-md); background: var(--track); font-size: 15px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{me.email}}</span><span class="sw-hint">L’e-mail de connexion à Kopycat.</span></div></div>

</section>
<section style="display: flex; flex-direction: column; gap: 16px; padding-top: 28px; border-top: 1px solid var(--line);"><div style="display: flex; flex-direction: column; gap: 4px;"><h2 id="cp-acces" style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em;">Accès</h2></div><div class="sw-card is-featured" style="border-radius: 22px; padding: 22px 24px; display: flex; flex-direction: column; gap: 6px;"><span style="display: flex; align-items: center; gap: 10px;"><span style="font-size: 20px; font-weight: 700;">Accès complet</span><span class="sw-badge sw-badge-accent">Ouvert</span></span><span style="font-size: 14px; line-height: 1.5; color: var(--ink-muted);">Ton compte a accès à tout Kopycat : apps, formats, créateurs, alertes et dossiers.</span></div></section>
</div>
</div>
</main>

<sc-if value="{{pal}}" hint-placeholder-val="{{false}}"><div style="position: fixed; inset: 0; z-index: 60;"><dc-import name="Palette" on-close="{{closePal}}" get="{{getFn}}" hint-size="100%,100%"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"user":{"editor":null},"signOut":{"editor":null},"$preview":{"width":1440,"height":1280}}'>
class Component extends DCLogic {

  renderVals() {
    const b = this.baseVals();
    return Object.assign({}, b, this.shellVals(), this.extraVals(b));
  }
  shellVals() {
    const st = this.state || {};
    const u = this.props.user;
    const me = u ? { prenom: u.prenom || null, email: u.email || '', initiale: String(u.initiale || u.prenom || u.email || '?').charAt(0).toUpperCase() }
                 : { prenom: 'Anthony', email: 'anthony@exemple.fr', initiale: 'A' };
    const I = {"accueil": "M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z", "apps": "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z", "formats": "M4 5h16v14H4zM10 9l5 3-5 3z", "createurs": "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6", "alertes": "M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20.5a2 2 0 0 0 4 0", "dossiers": "M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"};
    const sb = [["accueil", "Accueil", "Main.dc.html"], ["apps", "Apps", "AppsA.dc.html"], ["formats", "Formats", "FormatsB.dc.html"], ["createurs", "Créateurs", "CreateursA.dc.html"], ["alertes", "Alertes", "AlertesA.dc.html"], ["dossiers", "Dossiers", "DossiersA.dc.html"]].map((x) => ({ d: I[x[0]], label: x[1], href: x[2], cur: x[0] === 'aucun' ? 'page' : 'false' }));
    return {
      sb, me, getFn: this.props && this.props.get,
      pal: !!st.pal, openPal: () => { if (!(this.state || {}).pal) this.setState({ pal: true }); }, closePal: () => this.setState({ pal: false }),
      aj: !!st.aj, ajOpen: st.aj ? 'true' : 'false', toggleAj: () => this.setState({ aj: !(this.state || {}).aj }), closeAj: () => this.setState({ aj: false })
    };
  }
  extraVals(b) {
    const st = this.state || {};
    const sec = st.sec || 'cp-profil';
    return {
      sub: [['Profil', 'cp-profil'], ['Accès', 'cp-acces']].map((s) => ({ l: s[0], href: '#' + s[1], cur: s[1] === sec ? 'page' : 'false', bg: s[1] === sec ? 'var(--accent-soft)' : 'transparent', ink: s[1] === sec ? 'var(--ink)' : 'var(--ink-muted)',
        pick: () => this.setState({ sec: s[1] }) })),
      logout: (e) => { if (this.props.signOut) { e.preventDefault(); this.props.signOut(); } }
    };
  }

  baseVals() {
    return {};
  }
}
</script>
</body>
</html>
