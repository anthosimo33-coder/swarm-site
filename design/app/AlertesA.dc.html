<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Swarm, alertes : la boîte de réception</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/swarm/tokens.css">
<link rel="stylesheet" href="ds/swarm/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05070C}
a{color:#4C9AFF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div class="sw" style="display: flex; flex-wrap: wrap; min-height: 1100px; background: var(--surface); color: var(--ink); font-family: var(--font-body);">

<nav class="sw-sidebar" aria-label="Navigation principale">
<a class="sw-side-logo" href="Main.dc.html" aria-label="Swarm, accueil"><span class="sw-app-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="8" r="2.3" fill="#FFFFFF"></circle><circle cx="11" cy="5" r="2.3" fill="#FFFFFF"></circle><circle cx="17" cy="8" r="2.3" fill="#FFFFFF"></circle><circle cx="8" cy="14" r="2.3" fill="#FFFFFF" fill-opacity="0.6"></circle><circle cx="14" cy="13" r="2.3" fill="#FFFFFF" fill-opacity="0.6"></circle><circle cx="19" cy="17" r="2.3" fill="#FFFFFF" fill-opacity="0.6"></circle><circle cx="11" cy="20" r="2.3" fill="#FFFFFF" fill-opacity="0.6"></circle></svg></span></a>
<button class="sw-side-item" type="button" data-cmdk="true" onClick="{{openPal}}" aria-label="Chercher" style="border: 0; background: transparent; font-family: inherit; cursor: pointer;"><span class="sw-side-ico"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM15.5 15.5L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Chercher</button>
<sc-for list="{{sb}}" as="n" hint-placeholder-count="6">
<a class="sw-side-item" href="{{n.href}}" aria-current="{{n.cur}}"><span class="sw-side-ico"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>{{n.label}}</a>
</sc-for>
<div class="sw-side-foot">
<a class="sw-avatar" href="CompteA.dc.html" aria-label="Mon compte" style="text-decoration: none;">{{me.initiale}}</a>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: var(--surface);">
<header style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 20px; padding: 32px 32px 0;">
<div style="display: flex; flex-direction: column; gap: 6px;"><h1 style="margin: 0; font-family: var(--font-display); font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -0.04em;">Alertes</h1><p style="margin: 0; font-size: 15px; color: var(--ink-muted);">{{subtitle}}</p></div>
<div style="display: flex; align-items: center; gap: 16px;"><sc-if value="{{hasUnread}}" hint-placeholder-val="{{true}}"><button class="sw-more" type="button" onClick="{{markRead}}" style="border: 0; background: transparent; cursor: pointer; font-family: inherit;">Tout marquer comme lu</button></sc-if><button class="sw-btn sw-btn-primary" type="button" onClick="{{openNa}}">Créer une alerte<span class="sw-btn-tile"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button></div>
</header>
<div style="margin: 24px 32px 0; padding: 12px 14px; border-radius: 20px; background: linear-gradient(180deg, var(--card-top), var(--card-bottom)); box-shadow: inset 0 0 0 1px var(--card-edge); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;"><div role="tablist" aria-label="Type" style="display: flex; gap: 4px; flex-wrap: wrap;"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: {{t.bg}}; color: {{t.ink}}; font: inherit; font-size: 14px; font-weight: {{t.fw}}; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; color: {{t.ic}};"><path d="{{t.d}}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{t.l}}<span style="font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint);">{{t.n}}</span></button></sc-for></div><sc-if value="{{hasRules}}" hint-placeholder-val="{{true}}"><button class="sw-pill" type="button" aria-pressed="{{mineOn}}" onClick="{{toggleMine}}" style="height: 36px; padding: 0 12px; border-radius: 10px; gap: 8px; font-size: 13px;"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Selon tes alertes</button></sc-if></div>
<div style="padding: 20px 32px 48px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start;">
<div style="display: flex; flex-direction: column; gap: 18px;">
<sc-if value="{{noAlert}}" hint-placeholder-val="{{false}}"><p style="margin: 8px 14px; font-size: 15px; color: var(--ink-muted);">{{noAlertText}}</p></sc-if>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5"><section style="display: flex; flex-direction: column; gap: 4px;"><h2 style="margin: 0 0 6px 6px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-muted);"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; color: var(--ink-faint);"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{g.g}}</h2>
<sc-for list="{{g.items}}" as="a" hint-placeholder-count="2"><a href="{{a.href}}" style="display: flex; align-items: center; gap: 16px; padding: 14px 18px 14px 14px; border-radius: 18px; background: {{a.bg}}; text-decoration: none; color: inherit;">
<span style="width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: {{a.dot}};"></span>
<span style="width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent);"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{a.ico}}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 15px; font-weight: {{a.w}}; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{a.title}}</span><span style="font-size: 13px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{a.sub}}</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 76px;"><span style="font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--accent);">{{a.big}}</span><span style="font-size: 11px; color: var(--ink-faint);">{{a.when}}</span></span>
<span style="display: flex; flex-shrink: 0; gap: 6px; justify-content: flex-end; width: 154px;"><sc-for list="{{a.covs}}" as="c" hint-placeholder-count="3"><span class="sw-video" style="display: block; width: 46px; border-radius: 10px;"><img class="sw-cover" src="{{c.src}}" alt="" loading="lazy"></span></sc-for></span>
</a></sc-for></section></sc-for>
</div>
<aside class="sw-card" style="border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;"><h2 class="sw-card-title" style="font-size: 17px;">Tes alertes</h2></div>
<sc-for list="{{rules}}" as="r" hint-placeholder-count="3"><div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; background: var(--track);"><span style="width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent);"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.ico}}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><button type="button" onClick="{{r.edit}}" title="Modifier cette alerte" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;"><span style="font-size: 14px; font-weight: 600; line-height: 1.35;">{{r.t}}</span><span style="font-size: 12px; color: var(--ink-faint);">{{r.s}}</span><sc-if value="{{r.n}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; font-weight: 600; color: var(--accent);">{{r.n}}</span></sc-if></button><button class="sw-btn sw-btn-icon" type="button" onClick="{{r.remove}}" aria-label="Supprimer cette alerte" style="width: 32px; height: 32px; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button></div></sc-for>
<sc-if value="{{noRules}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-muted);">Aucune alerte pour l’instant.</p></sc-if>
</aside>
</div>
</main>

<sc-if value="{{na}}" hint-placeholder-val="{{false}}"><div style="position: fixed; inset: 0; z-index: 55;"><dc-import name="NouvelleAlerte" on-close="{{closeNa}}" on-create="{{addRule}}" rule="{{naRule}}" niches="{{naNiches}}" preview="{{naPreview}}" get="{{getFn}}" hint-size="100%,100%"></dc-import></div></sc-if>

<sc-if value="{{pal}}" hint-placeholder-val="{{false}}"><div style="position: fixed; inset: 0; z-index: 60;"><dc-import name="Palette" on-close="{{closePal}}" get="{{getFn}}" hint-size="100%,100%"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"user":{"editor":null},"signOut":{"editor":null},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {

  renderVals() {
    const b = this.baseVals();
    return Object.assign({}, b, this.shellVals(), this.extraVals(b));
  }
  shellVals() {
    const st = this.state || {};
    const u = this.props.user;
    const me = u ? { prenom: u.prenom || null, email: u.email || '', initiale: String(u.initiale || u.prenom || u.email || '?').charAt(0).toUpperCase() }
                 : { prenom: 'Anthony', email: 'anthony@exemple.fr', initiale: 'A' };
    const I = {"accueil": "M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z", "apps": "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z", "formats": "M4 5h16v14H4zM10 9l5 3-5 3z", "createurs": "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6", "alertes": "M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20.5a2 2 0 0 0 4 0", "dossiers": "M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"};
    const sb = [["accueil", "Accueil", "Main.dc.html"], ["apps", "Apps", "AppsA.dc.html"], ["formats", "Formats", "FormatsB.dc.html"], ["createurs", "Créateurs", "CreateursA.dc.html"], ["alertes", "Alertes", "AlertesA.dc.html"], ["dossiers", "Dossiers", "DossiersA.dc.html"]].map((x) => ({ d: I[x[0]], label: x[1], href: x[2], cur: x[0] === 'alertes' ? 'page' : 'false' }));
    return {
      sb, me, getFn: this.props && this.props.get,
      pal: !!st.pal, openPal: () => { if (!(this.state || {}).pal) this.setState({ pal: true }); }, closePal: () => this.setState({ pal: false }),
      aj: !!st.aj, ajOpen: st.aj ? 'true' : 'false', toggleAj: () => this.setState({ aj: !(this.state || {}).aj }), closeAj: () => this.setState({ aj: false })
    };
  }
  extraVals(b) {
    const st = this.state || {};
    const P = this.props || {};
    // Ce que la personne garde (saved) : ses alertes (alertRules) et le moment de « Tout marquer comme lu » (seen).
    // Sur le canevas, ces props n'existent pas : état local, avec les alertes d'exemple.
    const site = typeof P.saved === 'function' && typeof P.save === 'function';
    const rulesV = site ? P.saved('alertRules') : st.rules;
    const rulesWait = site && rulesV === undefined;
    const mine = Array.isArray(rulesV) ? rulesV.filter((r) => r && typeof r === 'object') : site ? [] : b.sampleRules;
    const seenV = site ? P.saved('seen') : st.seen;
    const seenAt = seenV && typeof seenV.alerts === 'number' ? seenV.alerts : null;
    const keepRules = (xs) => (site ? P.save('alertRules', xs) : this.setState({ rules: xs }));
    // Une alerte = { id, createdAt, quoi: 'compte'|'video'|'format', niche: nom|null, seuil: nombre, marche: code|null }.
    const SL = { compte: [[10, '10×'], [100, '100×'], [1000, '1 000×']], video: [[5e5, '500 k'], [1e6, '1 M'], [5e6, '5 M']], format: [[3, '3'], [5, '5'], [10, '10']] };
    const sl = (r) => { const m = (SL[r.quoi] || []).filter((x) => x[0] === r.seuil)[0]; return m ? m[1] : String(r.seuil); };
    const MKN = (c) => ({ FR: 'France', US: 'États-Unis', MX: 'Mexique', ES: 'Espagne', BR: 'Brésil', DE: 'Allemagne', SA: 'Arabie saoudite', RU: 'Russie' })[c] || (c && /^[A-Z]{2}$/.test(c) && typeof Intl !== 'undefined' && Intl.DisplayNames ? (new Intl.DisplayNames(['fr'], { type: 'region' }).of(c) || c) : '');
    const MKW = (t) => new Proxy(t, { get: (o, c) => o[c] || MKN(String(c)) }); // un nom pour chaque pays, pas de « autres langues »
    const MKL = MKW({ FR: 'France', US: 'États-Unis', MX: 'Mexique', ES: 'Espagne', BR: 'Brésil' });
    const ICO = { compte: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6', video: 'M3 17l5.5-5.5 3.5 3.5L20 7M14 7h6v6', format: 'M5 6h14M12 6v13M9 19h6' };
    const known = (r) => !!SL[r.quoi] && typeof r.seuil === 'number';
    const titleOf = (r) => (!known(r) ? String(r.t || 'Alerte') : r.quoi === 'compte' ? 'Un compte fait ' + sl(r) + ' sa normale'
      : r.quoi === 'video' ? 'Une vidéo d’app passe ' + sl(r) + ' de vues' : 'Un format repris par ' + sl(r) + ' comptes ou plus');
    const subOf = (r) => (!known(r) ? String(r.s || '') : (r.niche || 'Toutes niches') + ' · ' + (MKL[r.marche] || 'tous les marchés'));
    // Une alerte de la semaine répond-elle à une alerte de la personne ? Sur le canevas, l'exemple dit à quelle alerte il répond.
    // null : on ne sait pas encore (niche d'une vidéo tant que le document « apps » charge).
    const match = (r, a) => {
      if (!known(r)) return false;
      if (a.kind === undefined) return a.rule === titleOf(r);
      if (r.marche && a.market !== r.marche) return false;
      if (r.quoi === 'format' ? !(a.kind === 'format' && a.accounts >= r.seuil)
        : r.quoi === 'video' ? !(a.kind === 'video' && !!a.slug && a.views >= r.seuil)
        : !(a.kind === 'video' && a.x >= r.seuil)) return false;
      if (!r.niche) return true;
      const n = b.nicheOf ? b.nicheOf(a) : null;
      return n === null ? null : n === r.niche;
    };
    const items = b.items || [];
    const hits = (r) => items.filter((a) => match(r, a) === true);
    const unsure = (r) => items.some((a) => match(r, a) === null);
    const mineOn = !!st.mine && mine.length > 0;
    const isMine = (a) => mine.some((r) => match(r, a) === true);
    const tab = st.tab || 'Toutes';
    const TABS = [['Toutes', () => true], ['Formats', (a) => a.typ === 'Format' || a.typ === 'Son'], ['Vidéos', (a) => a.typ === 'Vidéo'], ['Comptes', (a) => a.typ === 'Compte']];
    const pool = mineOn ? items.filter(isMine) : items;
    const keep = (TABS.filter((t) => t[0] === tab)[0] || TABS[0])[1];
    // Non lu : publié après « Tout marquer comme lu » ; sans rien d'enregistré, ce qui date d'aujourd'hui ou d'hier.
    const unread = (a) => (seenAt !== null ? !!a.at && a.at > seenAt : !!a.unread);
    const groups = [];
    pool.filter(keep).forEach((a) => {
      const u = unread(a);
      const it = Object.assign({}, a, { dot: u ? 'var(--accent)' : 'transparent', bg: u ? 'var(--accent-soft)' : 'transparent', w: u ? '700' : '600' });
      if (!groups.length || groups[groups.length - 1].g !== a.g) groups.push({ g: a.g, items: [] });
      groups[groups.length - 1].items.push(it);
    });
    // Le nombre d'une alerte compte les alertes listées ici (document « alerts » : 40 vidéos et 20 formats au plus), pas toute la semaine.
    const count = (r) => { if (!known(r) || unsure(r)) return ''; const c = hits(r).length;
      return c === 0 ? 'Aucune parmi les alertes' : c + ' parmi les alertes'; };
    const editId = st.na ? st.editId || null : null;
    const rules = mine.map((r) => ({ t: titleOf(r), s: subOf(r), n: count(r), ico: ICO[r.quoi] || ICO.format,
      edit: () => this.setState({ na: true, editId: r.id }),
      remove: () => keepRules(mine.filter((x) => x !== r)) }));
    const same = (p, q) => p.quoi === q.quoi && (p.niche || null) === (q.niche || null) && p.seuil === q.seuil && (p.marche || null) === (q.marche || null);
    const kindN = (r, n) => n + (r.quoi === 'format' ? (n > 1 ? ' formats' : ' format') : (n > 1 ? ' vidéos' : ' vidéo'));
    const TABIC = { Toutes: 'M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20.5a2 2 0 0 0 4 0', Formats: 'M3 4h18v16H3zM7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4', 'Vidéos': 'M4 5h16v14H4zM10 9l5 3-5 3z', Comptes: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6' };
    return {
      groups, rules, hasRules: mine.length > 0, noRules: !rulesWait && mine.length === 0,
      subtitle: mineOn ? 'Ce que le Radar a repéré cette semaine, selon tes alertes.' : 'Ce que le Radar a repéré cette semaine.',
      noAlert: groups.length === 0, noAlertText: mineOn ? 'Rien cette semaine pour tes alertes' + (tab === 'Toutes' ? '.' : ' dans ce type.') : 'Aucune alerte de ce type cette semaine.',
      tabs: TABS.map((t) => ({ l: t[0], d: TABIC[t[0]] || TABIC.Toutes, n: pool.filter(t[1]).length, on: t[0] === tab ? 'true' : 'false', bg: t[0] === tab ? 'rgba(255,255,255,0.10)' : 'transparent', ink: t[0] === tab ? 'var(--ink)' : 'var(--ink-muted)', fw: t[0] === tab ? '600' : '500', ic: t[0] === tab ? 'var(--accent)' : 'var(--ink-faint)', pick: () => this.setState({ tab: t[0] }) })),
      mineOn: mineOn ? 'true' : 'false', toggleMine: () => this.setState({ mine: !mineOn }),
      hasUnread: items.some(unread),
      markRead: () => { const v = Object.assign({}, seenV || {}, { alerts: Date.now() }); if (site) P.save('seen', v); else this.setState({ seen: v }); },
      na: !!st.na, openNa: () => this.setState({ na: true, editId: null }), closeNa: () => this.setState({ na: false, editId: null }),
      naRule: editId ? mine.filter((r) => r.id === editId)[0] || null : null,
      naNiches: b.niches || null,
      // Ce que l'alerte en cours de réglage trouve dans les alertes de la semaine (aperçu de « Nouvelle alerte »).
      naPreview: (r) => { if (unsure(r)) return null; const xs = hits(r);
        return { text: xs.length ? kindN(r, xs.length) : 'Aucune pour ces critères', hits: xs.filter((a) => a.covs && a.covs[0] && a.covs[0].src).slice(0, 3).map((a) => ({ src: a.covs[0].src, x: a.big })) }; },
      addRule: (f) => {
        const r = { quoi: f.quoi, niche: f.niche || null, seuil: f.seuil, marche: f.marche || null };
        const now = Date.now();
        if (editId) keepRules(mine.map((x) => (x.id === editId ? Object.assign({}, x, r) : x)));
        else if (!mine.some((x) => same(x, r))) keepRules([Object.assign({ id: now.toString(36) + Math.random().toString(36).slice(2, 6), createdAt: now }, r)].concat(mine));
      }
    };
  }
