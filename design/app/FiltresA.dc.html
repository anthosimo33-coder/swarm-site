<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Swarm, filtres : menus avec compteurs</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/swarm/tokens.css">
<link rel="stylesheet" href="ds/swarm/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05070C}
a{color:#4C9AFF}a:hover{color:#FFFFFF}
.fa-row{transition:background .2s ease}
.fa-row:hover{background:rgba(255,255,255,0.05) !important}
</style>
</helmet>
<div class="sw" style="position: relative; min-height: 720px; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-body);">

<div style="padding: 28px 32px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px;">
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; font-weight: 700; letter-spacing: -0.04em;">Apps</h1>
<span style="font-size: 14px; color: var(--ink-muted);"><span style="font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--ink);">{{total}}</span> apps correspondent</span>
</div>

<div style="padding: 20px 32px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
<sc-for list="{{bar}}" as="b" hint-placeholder-count="3">
<button class="sw-pill" type="button" onClick="{{b.toggle}}" aria-expanded="{{b.open}}" aria-haspopup="listbox" style="height: 42px; padding: 0 12px 0 14px; gap: 6px; background: {{b.bg}}; border-color: {{b.edge}};"><span style="color: var(--ink-faint);">{{b.k}}</span><span style="font-weight: 600;">{{b.v}}</span><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink-faint); transform: {{b.rot}}; transition: transform .3s cubic-bezier(.2,.8,.2,1);"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</sc-for>
<sc-for list="{{chips}}" as="c" hint-placeholder-count="1">
<button class="sw-badge sw-badge-accent" type="button" onClick="{{c.clear}}" aria-label="Retirer le filtre {{c.label}}" style="height: 32px; padding: 0 8px 0 12px; border: 0; cursor: pointer; font-family: inherit;">{{c.label}}<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
</sc-for>
</div>

<div aria-hidden="true" style="margin: 20px 32px 0; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; opacity: 0.55;">
<sc-for list="{{ghost}}" as="g" hint-placeholder-count="7">
<div style="height: 64px; display: grid; grid-template-columns: 40px 1.6fr 1fr 1fr 1fr; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--line);">
<span style="font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint);">{{g.rank}}</span>
<span class="sw-app-name">{{g.n}}</span>
<span style="font-size: 13px; color: var(--ink-faint);">{{g.niche}}</span>
<span style="font-size: 14px; font-weight: 600;">{{g.v}}</span>
<span style="font-size: 14px; font-weight: 600; white-space: nowrap;">{{g.rev}}</span>
</div>
</sc-for>
</div>

<sc-if value="{{menu.on}}" hint-placeholder-val="{{true}}">
<div role="listbox" aria-label="{{menu.title}}" style="position: absolute; top: 132px; left: {{menu.left}}; width: 360px; box-sizing: border-box; padding: 8px; border-radius: 22px; background: rgba(13,17,26,0.94); border: 1px solid var(--glass-edge); backdrop-filter: var(--glass-blur-strong); -webkit-backdrop-filter: var(--glass-blur-strong); box-shadow: var(--shadow-float), 0 0 0 1px rgba(0,0,0,0.3); animation: sw-rise .3s cubic-bezier(.2,.8,.2,1) both;">
<div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; margin-bottom: 6px; border-radius: 14px; background: var(--track);"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink-faint);"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM15.5 15.5L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg><input id="fa-q" type="search" aria-label="{{menu.search}}" placeholder="{{menu.search}}" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink); font: inherit; font-size: 14px;"></div>
<sc-for list="{{menu.items}}" as="it" hint-placeholder-count="7">
<button class="fa-row" type="button" role="option" aria-selected="{{it.sel}}" onClick="{{it.pick}}" style="width: 100%; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 12px; background: {{it.bg}}; color: var(--ink); font: inherit; font-size: 14px; text-align: left; cursor: pointer; opacity: {{it.o}};">
<span aria-hidden="true" style="width: 18px; height: 18px; border-radius: {{it.radius}}; border: 1.5px solid {{it.box}}; background: {{it.fill}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="11" height="11" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="{{it.tick}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<sc-if value="{{it.flag}}" hint-placeholder-val="{{false}}"><span class="sw-flag">{{it.flag}}</span></sc-if>
<span style="flex: 1 1 auto; min-width: 0; font-weight: {{it.w}};">{{it.label}}</span>
<span style="font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums;">{{it.n}}</span>
</button>
</sc-for>
<div style="margin-top: 6px; padding: 12px 12px 6px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<span style="font-size: 12px; line-height: 1.4; color: var(--ink-faint); max-width: 200px;">{{menu.foot}}</span>
<button class="sw-btn sw-btn-primary sw-btn-sm" type="button" onClick="{{close}}">Voir {{total}} apps<span class="sw-btn-tile"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const open = st.open === undefined ? 'marche' : st.open;
    const market = st.market === undefined ? 'FR' : st.market;
    const niches = st.niches || [];
    const DATA = [["Rizz App","Séduction IA",["US","ID","MX"],59.67],["Astra AI","Études",["ID","US","ES","FR","MX","BR"],57.66],["Knowunity","Études",["US","ID","ES","FR","MX"],44.43],["Love8","Couple",["ID","US","FR","MX"],35.06],["WRizz","Séduction IA",["US","ID"],31.94],["Wing AI","Séduction IA",["US","MX"],19.62],["Cal AI","Santé et physique",["US"],17.13],["Praktika","Langues",["ID","US","FR","BR","MX"],16.58],["RecentFollow","Jalousie et ex",["US","MX"],13.06],["The Cringe","Jalousie et ex",["US","FR","ID"],12.18],["Plug AI","Séduction IA",["US","ID"],11.0],["Umax","Santé et physique",["US"],10.16],["The Ick","Jalousie et ex",["ID","FR","US","MX","ES"],9.82],["FollowOtter","Jalousie et ex",["US"],8.74],["Shortfy","Side hustle",["FR"],7.3],["Airbuds","Social et loisirs",["US","MX","ID"],7.06],["Sweatcoin","Side hustle",["MX","US","ID","ES"],5.19],["Voca AI","Langues",["US","BR","ID","FR"],4.97],["Snitchy","Jalousie et ex",["US","FR","ID"],4.93],["Fluencify","Side hustle",["BR","US","MX","ID"],4.69],["What Brandon Thinks","Jalousie et ex",["US","MX","BR","ID","FR"],4.53],["Flo","Santé et physique",["US","BR","ID"],4.4],["Bible Chat","Foi",["US","ID","MX"],4.37],["Quittr","Santé et physique",["US"],3.74],["Creed","Foi",["US","ID"],3.34],["Airlearn","Langues",["US","MX"],3.25],["FollowSpy","Jalousie et ex",["MX","US"],3.18],["Retain Cards","Études",["FR","ID","US","MX","BR"],3.03],["Glam AI","Beauté IA",["US","ID","MX"],2.61],["Shady","Jalousie et ex",["US","MX","FR","ID"],1.73],["Fit AI","Santé et physique",["US"],1.59],["Finch","Santé et physique",["US"],1.46],["Serializd","Social et loisirs",["US"],1.3],["Rizz Master","Séduction IA",["US"],1.15],["CheatLove","Jalousie et ex",["FR"],0.78],["Loverzz","Couple",["US","ID","BR"],0.64],["Flert Now","Séduction IA",[],0.43],["Sunsay","Autres",[],0.38],["Stalkie","Jalousie et ex",["US","BR","MX","FR","ID"],0.34],["SafeNow","Autres",[],0.22],["Katch","Jalousie et ex",["US","FR"],0.11],["Palima","Autres",["FR"],0.09],["Lurk","Jalousie et ex",["MX","US"],0.09],["TrendSaaS","Side hustle",["FR","ID"],0.06],["Susly","Jalousie et ex",["US","MX","ID"],0.06],["Kairo Alarme","Autres",["BR"],0.02],["Leaked DMs","Jalousie et ex",[],0.01]];
    const MK = [['ALL', 'Tous les marchés', ''], ['US', 'États-Unis', 'US'], ['ID', 'Indonésie et Vietnam', 'ID'], ['MX', 'Mexique et Amérique latine', 'MX'], ['FR', 'France', 'FR'], ['BR', 'Brésil', 'BR'], ['ES', 'Espagne', 'ES']];
    const NI = ['Séduction IA', 'Jalousie et ex', 'Études', 'Santé et physique', 'Couple', 'Langues', 'Side hustle', 'Foi', 'Social et loisirs', 'Beauté IA'];
    const okM = (r, m) => m === 'ALL' || r[2].indexOf(m) >= 0;
    const okN = (r, ns) => ns.length === 0 || ns.indexOf(r[1]) >= 0;
    const result = DATA.filter((r) => okM(r, market) && okN(r, niches));
    const set = (patch) => this.setState(Object.assign({ open, market, niches }, patch));
    const mLabel = MK.filter((m) => m[0] === market)[0][1];
    const nLabel = niches.length === 0 ? 'Toutes' : (niches.length === 1 ? niches[0] : niches.length + ' niches');
    const mkBar = (key, k, v) => ({
      k, v, open: open === key,
      bg: open === key ? 'var(--tab-on)' : 'var(--track)', edge: open === key ? 'var(--accent-edge)' : 'var(--line)',
      rot: open === key ? 'rotate(180deg)' : 'rotate(0deg)',
      toggle: () => set({ open: open === key ? '' : key })
    });
    const bar = [mkBar('marche', 'Marché', market === 'ALL' ? 'Tous' : mLabel), mkBar('niche', 'Niche', nLabel), mkBar('plateforme', 'Plateforme', 'Toutes')];
    const chips = [];
    if (market !== 'ALL') chips.push({ label: mLabel, clear: () => set({ market: 'ALL' }) });
    niches.forEach((n) => chips.push({ label: n, clear: () => set({ niches: niches.filter((x) => x !== n) }) }));
    const radio = (on) => ({ radius: '50%', box: on ? '#4C9AFF' : 'var(--line-strong)', fill: on ? '#4C9AFF' : 'transparent', tick: on ? '#05070C' : 'transparent' });
    const check = (on) => ({ radius: '5px', box: on ? '#4C9AFF' : 'var(--line-strong)', fill: on ? '#4C9AFF' : 'transparent', tick: on ? '#05070C' : 'transparent' });
    let menu = { on: false, items: [], left: '32px', title: '', search: '', foot: '' };
    if (open === 'marche') {
      menu = {
        on: true, left: '32px', title: 'Marché', search: 'Chercher un marché', foot: 'Le marché choisi vaut pour toute l’app : accueil, apps, formats, créateurs.',
        items: MK.map((m) => {
          const n = DATA.filter((r) => okM(r, m[0]) && okN(r, niches)).length;
          const on = market === m[0];
          return Object.assign({ label: m[1], flag: m[2] || false, n: n + ' apps', sel: on, bg: on ? 'var(--accent-soft)' : 'transparent', w: on ? 600 : 500, o: n === 0 ? 0.45 : 1, pick: () => set({ market: m[0] }) }, radio(on));
        })
      };
    } else if (open === 'niche') {
      menu = {
        on: true, left: '196px', title: 'Niche', search: 'Chercher une niche', foot: 'Plusieurs niches possibles. Les nombres tiennent compte du marché choisi.',
        items: NI.map((nm) => {
          const n = DATA.filter((r) => okM(r, market) && r[1] === nm).length;
          const on = niches.indexOf(nm) >= 0;
          return Object.assign({ label: nm, flag: false, n: n + ' apps', sel: on, bg: on ? 'var(--accent-soft)' : 'transparent', w: on ? 600 : 500, o: n === 0 ? 0.45 : 1, pick: () => set({ niches: on ? niches.filter((x) => x !== nm) : niches.concat([nm]) }) }, check(on));
        })
      };
    } else if (open === 'plateforme') {
      menu = {
        on: true, left: '360px', title: 'Plateforme', search: 'Chercher une plateforme', foot: 'YouTube Shorts arrive bientôt.',
        items: [['TikTok', ''], ['Instagram', ''], ['YouTube Shorts', 'Bientôt']].map((p) => Object.assign({ label: p[0], flag: false, n: p[1], sel: false, bg: 'transparent', w: 500, o: p[1] ? 0.45 : 1, pick: () => {} }, check(false)))
      };
    }
    const colors = ['var(--thumb-plum)', 'var(--blue-600)', 'var(--thumb-navy)', 'var(--thumb-pine)', 'var(--thumb-violet)', 'var(--thumb-umber)', 'var(--thumb-amber)'];
    const ghost = result.slice(0, 7).map((r, i) => ({ rank: String(i + 1).padStart(2, '0'), n: r[0], i: r[0].charAt(0), c: colors[i % colors.length], niche: r[1], v: r[3].toFixed(1).replace('.', ',') + ' M', rev: 'Entre ' + Math.round(r[3] * 2.5) + ' et ' + Math.round(r[3] * 3.5) + ' k€' }));
    return { bar, chips, menu, ghost, total: result.length, close: () => set({ open: '' }) };
  }
}
</script>
</body>
</html>
