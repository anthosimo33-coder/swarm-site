# Vérifications de chaque push et de chaque pull request (audit Q8, 19/11 : aucune CI ; check, test:apercu et la
# régénération ne bloquaient aucun déploiement). Pour qu'un échec bloque la fusion dans main, rendre ce job
# obligatoire dans les règles de protection de la branche (GitHub › Settings › Branches).
# En local : npm run verify (mêmes étapes, sans l'écart de génération).
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci

      # Les écrans générés (src/app/pages, src/pages, routes.js, styles) doivent être ceux des canevas design/*.dc.html.
      - name: Régénération sans écart (npm run gen)
        run: |
          npm run gen
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Fichiers générés différents des canevas : lancer npm run gen et commiter le résultat."
            git status --porcelain
            git --no-pager diff --stat
            exit 1
          fi

      - name: Typage du backend (tsc -p convex)
        run: npx tsc --noEmit -p convex
      - name: Pages sans trou (npm run check)
        run: npm run check
      - name: Verrou de l'aperçu (npm run test:apercu)
        run: npm run test:apercu
      - name: Mutants du verrou (npm run test:apercu:mutants)
        run: npm run test:apercu:mutants
      - name: Routes /cover et /avatar (npm run test:cover)
        run: npm run test:cover
      - name: Documents de la synchro (npm run test:radar)
        run: npm run test:radar
      - name: Suivis et dossiers (npm run test:saved)
        run: npm run test:saved
      - name: Props des imports de canevas (npm run test:imports)
        run: npm run test:imports
      - name: En-têtes de cache (npm run test:cache)
        run: npm run test:cache
      - name: Écrans sur données de banc (npm run check:data)
        run: npm run check:data
