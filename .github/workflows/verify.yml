# Vérifications de chaque push et de chaque pull request (audit Q8, 19/11 : aucune CI ; check, test:apercu et la
# régénération ne bloquaient aucun déploiement). Pour qu'un échec bloque la fusion dans main, rendre ce job
# obligatoire dans les règles de protection de la branche (GitHub › Settings › Branches).
# En local : npm run verify (les mêmes vérifications ; la CI vérifie en plus l'écart de génération).
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci

      # Les écrans générés (src/app/pages, src/pages, routes.js, styles) doivent être ceux des canevas design/*.dc.html.
      - name: Régénération sans écart (npm run gen)
        run: |
          npm run gen
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Fichiers générés différents des canevas : lancer npm run gen et commiter le résultat."
            git status --porcelain
            git --no-pager diff --stat
            exit 1
          fi

      # Toutes les vérifications, celles de `npm run verify` et elles seules : la liste vit dans package.json. Jusqu'au
      # 20/11, ce fichier les recopiait une par une, et 10 n'y étaient jamais entrées (auth, compte, paiement,
      # public, écrans, Black Friday, Whop, comptes, app, génération) alors que le README les disait lancées en CI.
      - name: Toutes les vérifications (npm run verify)
        run: npm run verify
